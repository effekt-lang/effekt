name: CI

on:
  pull_request:

jobs:
  tests:
    uses: ./.github/workflows/tests.yml
    with:
      # no automatic reruns on PRs: flaky tests should annoy us into fixing them
      max-attempts: 1

  community-build:
    name: "Community Build"
    # needs: tests # Note: if we want to save CI minutes, then enable this. Otherwise the CI turnaround being faster by 15-20 minutes is very worth it.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'true'

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true

      - name: Set up nix-fast-build and jq
        run: nix profile install --inputs-from . nixpkgs#nix-fast-build nixpkgs#jq

      - name: Lock the community projects at their current state
        run: nix flake lock

      - name: Build Effekt with Nix
        run: nix-fast-build --no-nom --skip-cached --flake '.#packages.x86_64-linux.effekt'

      - name: Build community projects with given Effekt
        run: nix-fast-build --no-nom --skip-cached --flake '.#legacyPackages.x86_64-linux.community'

      - name: Check that broken community projects still fail
        run: |
          nix-fast-build --no-nom --flake '.#legacyPackages.x86_64-linux.broken' \
            --result-format json --result-file broken.json || true
          jq -f .github/broken-verdict.jq broken.json
