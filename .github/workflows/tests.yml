name: Tests

on:
  workflow_call:
    inputs:
      max-attempts:
        description: 'How many times each test step is attempted'
        type: number
        required: true

jobs:
  build-and-compile:
    name: "Build & Compile"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: 'true'

      - uses: ./.github/actions/setup-effekt

      - name: Compile project
        run: sbt compile Test/compile

      - name: Cache compiled artifacts
        uses: actions/cache/save@v5
        with:
          path: |
            target
            project/target
            project/project/target
            kiama/jvm/target
            kiama/js/target
            effekt/jvm/target
            effekt/js/target
            ~/.ivy2/cache
            ~/.sbt
            ~/.cache/coursier
          key: effekt-build-${{ github.sha }}

  internal-tests:
    name: "Internal Tests & Verify Binary"
    needs: build-and-compile
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: 'true'

      - uses: ./.github/actions/setup-effekt

      - uses: ./.github/actions/restore-build-cache

      - name: Run internal tests
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 120
          max_attempts: ${{ inputs.max-attempts }}
          retry_on: error
          command: sbt testRemaining kiamaJVM/test effektJS/test

      - name: Assemble fully optimized JS file
        run: sbt effektJS/assembleJS

      - name: Install effekt binary
        run: sbt install

      - name: Test effekt binary
        run: effekt --help

  windows-tests:
    name: "Windows Smoke Test"
    needs: build-and-compile
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: 'true'

      - uses: ./.github/actions/setup-effekt

      - name: Compile project
        run: sbt Test/compile

      - name: Run Windows smoke test
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 120
          max_attempts: ${{ inputs.max-attempts }}
          retry_on: error
          command: sbt testWindowsSmoke

  macos-llvm-tests:
    name: "macOS LLVM Smoke Tests"
    needs: build-and-compile
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: 'true'

      - uses: ./.github/actions/setup-effekt
        with:
          install-dependencies: 'true'

      - name: Compile project
        run: sbt Test/compile

      - name: Run macOS LLVM smoke tests (with debug)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 120
          max_attempts: ${{ inputs.max-attempts }}
          retry_on: error
          command: EFFEKT_DEBUG=1 sbt "effektJVM/testOnly effekt.LLVMTests"

  js-tests:
    name: "JS Backend"
    needs: build-and-compile
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: 'true'

      - uses: ./.github/actions/setup-effekt

      - uses: ./.github/actions/restore-build-cache

      - name: Run JavaScript backend tests
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 120
          max_attempts: ${{ inputs.max-attempts }}
          retry_on: error
          command: sbt testBackendJS

  chez-tests:
    name: "Chez Backend"
    needs: build-and-compile
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: 'true'

      - uses: ./.github/actions/setup-effekt
        with:
          install-dependencies: 'true'

      - uses: ./.github/actions/restore-build-cache

      - name: Run Chez Scheme backend tests
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 120
          max_attempts: ${{ inputs.max-attempts }}
          retry_on: error
          command: sbt testBackendChez

  llvm-tests:
    name: "LLVM Backend (${{ matrix.configuration }})"
    needs: build-and-compile
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - configuration: default
            envvars: ''
          - configuration: debug & valgrind
            envvars: 'EFFEKT_VALGRIND=1 EFFEKT_DEBUG=1'
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: 'true'

      - uses: ./.github/actions/setup-effekt
        with:
          install-dependencies: 'true'
          install-valgrind: 'true'

      - uses: ./.github/actions/restore-build-cache

      - name: Run LLVM backend tests (${{ matrix.configuration }})
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 120
          max_attempts: ${{ inputs.max-attempts }}
          retry_on: error
          command: ${{ matrix.envvars }} sbt testBackendLLVM
